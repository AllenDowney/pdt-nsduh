  - name: NEWRACE2
    label: RC-RACE/HISPANICITY RECODE (7 LEVELS)
    description: Because the reordering of the response options in alphabetical order in the 2022 NSDUH
      placed “American Indian or Alaska Native” as the first option, the unweighted number of non-Hispanic
      American Indian or Alaska Native respondents increased from prior years. Additionally, in 2023,
      the race and ethnicity questions in the in-person questionnaire became self-administered instead
      of being administered by an interviewer, which again seems to have increased the size of the unweighted
      “American Indian or Alaska Native” sample. Despite the weighted population size for non-Hispanic
      American Indian or Alaska Native people being consistent between years, caution is advised in comparing
      outcomes for this group over time due to the change in the unweighted number of respondents.
    type: number(id)
    examples:
    - 1
    - 3
    - 4
    - 5
    - 7
    details: |
      Codes: 1 = NonHisp White; 2 = NonHisp Black/Afr Am; 3 = NonHisp Native Am/AK Native; 4 = NonHisp Native HI/Other Pac Isl; 5 = NonHisp Asian; 6 = NonHisp more than one race; 7 = Hispanic

      Available: 2025
