  - name: KSSLR6MON
    label: RC-K6 TOTAL SCORE IN PAST MONTH
    type: number(quantity)
    range:
    - 0
    - 24
    details: |
      Notes: NOTE: The following variable, KSSLR6MON, is a score with values ranging from 0 to 24 indicating the level of psychological distress over the past 30 days (past month). This variable is based on imputed data collected from a series of six questions known as the K6, asking adult respondents how frequently they experienced symptoms of psychological distress during the past 30 days. These questions include the following symptoms of distress: feeling nervous (IRDSTNRV30), feeling hopeless (IRDSTHOP30), feeling restless or fidgety (IRDSTRST30), feeling so sad or depressed that nothing could cheer you up (IRDSTCHR30), feeling that everything was an effort (IRDSTEFF30), and feeling down on yourself, no good, or worthless (IRDSTNGD30). For each of the six items listed above, responses of "all of the time" were coded 4, "most of the time" were coded 3, "some of the time" were coded 2, "a little of the time" were coded 1, and "none of the time" were coded 0. These assigned values were summed across the six items to calculate a total score for KSSLR6MON.

