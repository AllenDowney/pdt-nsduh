# to ship or build-only and fill reviewed_by and reviewed_on. `unknown` blocks
# shipping anything that depends on it.
terms:
  url: "https://www.samhsa.gov/data/data-we-collect/nsduh-national-survey-drug-use-and-health/datafiles"
  summary: Not yet reviewed.
  data: unknown
  documentation: unknown
  metadata: unknown
  llm_processing: unknown
dimensions:
  wave:
    label: "year"
releases:
  - id: "2025"
    label: "NSDUH 2025 public use file (v1)"
    status: current
    sources: [nsduh-2025-stata]
